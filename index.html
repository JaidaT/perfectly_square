<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />

    <title>Perfectly Square</title>
  </head>
  <body>
    <header>
      <h1>Perfectly Square</h1>
      <h2>Expense splitter for two</h2>
    </header>

    <main>
      <!-- Currently Owed -->
      <div id="currently-owed" class="card">
        <div>
          <h3>Currently Owed</h3>
        </div>

        <div class="currently-owed_middle-container">
          <!-- User 1 -->
          <div class="currently-owed_user1">
            <h5 id="owedUser1Label"></h5>
            <div class="currently-owed_inner-container">
              <p id="u1OwedDisplay"></p>
            </div>
          </div>
          <!-- User 2 -->
          <div class="currently-owed_user2">
            <h5 id="owedUser2Label"></h5>
            <div class="currently-owed_inner-container">
              <p id="u2OwedDisplay"></p>
            </div>
          </div>
        </div>
        <!-- Btn Row -->
        <div class="btn-row">
          <button id="clearOwedBtn">Clear</button>
        </div>
      </div>

      <!-- Add Expense -->
      <div id="add-expense" class="card">
        <div>
          <h4>Add Expense</h4>
        </div>

        <div class="add-expense_middle-container">
          <!-- User Select -->
          <div class="add-expense_inner-container">
            <label for="addExpenseUserSelect">User</label>
            <select id="addExpenseUserSelect">
              <option value="[user 1]">[ user 1 ]</option>
              <option value="[user 2]">[ user 2 ]</option>
            </select>
          </div>
          <!-- Expense Name -->
          <div class="add-expense_inner-container">
            <label for="expenseNameInput">Expense Name</label>
            <input id="expenseNameInput" type="text" />
          </div>
          <!-- Expense Amount -->
          <div class="add-expense_inner-container">
            <label for="expenseAmountInput">Total Amount ($)</label>
            <input id="expenseAmountInput" type="number" />
          </div>
          <!-- Your Cost Share (%) -->
          <div class="add-expense_inner-container">
            <label for="costShareInput">Your Cost Share (%)</label>
            <input id="costShareInput" type="number" />
          </div>
        </div>
        <!-- Btn Row -->
        <div class="btn-row">
          <p id="inputError"></p>
          <button id="addExpenseBtn">Add Expense</button>
        </div>
      </div>

      <!-- Edit Users -->
      <div id="add-expense" class="card">
        <div>
          <h4>Edit Users</h4>
        </div>

        <div class="edit-user_middle-container">
          <!-- User 1 -->
          <div class="edit-user_inner-container">
            <label for="editUser1Input">User 1 Name</label>
            <input id="editUser1Input" type="text" />
          </div>
          <!-- User 2 -->
          <div class="edit-user_inner-container">
            <label for="editUser2Input">User 2 Name</label>
            <input id="editUser2Input" type="text" />
          </div>
        </div>
        <!-- Btn Row -->
        <div class="btn-row">
          <button id="saveUsersBtn">Save</button>
        </div>
      </div>

      <!-- Currency Converter (API) -->
      <div id="converter" class="card">
        <div>
          <h4>Currency Converter</h4>
        </div>

        <div class="currency-converter_middle-container">
          <!-- From -->
          <div class="currency-converter_inner-container">
            <label for="convertFromInput">From</label>
            <div class="control-row">
              <input type="number" id="convertFromInput" />
              <select id="convertFromSelect">
                <option>CAD</option>
                <option>USD</option>
                <option>EUR</option>
                <option>GBP</option>
                <option>AUD</option>
                <option>AED</option>
                <option>ANG</option>
                <option>BDT</option>
                <option>BRL</option>
                <option>CNY</option>
                <option>EGP</option>
                <option>HKD</option>
                <option>IDR</option>
                <option>INR</option>
                <option>JPY</option>
                <option>KRW</option>
                <option>KYD</option>
                <option>MXN</option>
                <option>PHP</option>
                <option>UAH</option>
                <option>ZAR</option>
              </select>
            </div>
          </div>
          <!-- To -->
          <div class="currency-converter_inner-container">
            <label for="convertToOutput">To</label>
            <div class="control-row">
              <output id="convertToOutput"></output>
              <select id="convertToSelect">
                <option>USD</option>
                <option>CAD</option>
                <option>EUR</option>
                <option>GBP</option>
                <option>AUD</option>
                <option>AED</option>
                <option>ANG</option>
                <option>BDT</option>
                <option>BRL</option>
                <option>CNY</option>
                <option>EGP</option>
                <option>HKD</option>
                <option>IDR</option>
                <option>INR</option>
                <option>JPY</option>
                <option>KRW</option>
                <option>KYD</option>
                <option>MXN</option>
                <option>PHP</option>
                <option>UAH</option>
                <option>ZAR</option>
              </select>
            </div>
          </div>
        </div>
        <!-- Btn Row -->
        <div class="btn-row">
          <button id="convertBtn">Convert</button>
        </div>
      </div>

      <!-- Expense Log -->
      <div id="log" class="card">
        <div>
          <h4>History</h4>
        </div>

        <div>
          <div>
          </div>
          <ul id="historyDisplay"></ul>
        </div>
      </div>
    </main>
  </body>
</html>
