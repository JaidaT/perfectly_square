<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />

    <title>Perfectly Square</title>
  </head>
  <body>
    <header>
      <h1>Perfectly Square</h1>
      <h2>Expense splitter for two</h2>
    </header>

    <main>
      <!-- Currently Owed -->
      <div id="currently-owed" class="card">
        <div>
          <h3>Currently Owed</h3>
        </div>

        <div class="currently-owed_middle-container">
          <!-- User 1 -->
          <div class="currently-owed_user">
            <h5>[user 1]</h5>
            <div class="currently-owed_inner-container">
              <!-- <p id="currently-owedU1Total">Total Spent: $</p> -->
              <p id="currently-owedU1Owed">Money owed: $0</p>
            </div>
          </div>
          <!-- User 2 -->
          <div class="currently-owed_user">
            <h5>[user 2]</h5>
            <div class="currently-owed_inner-container">
              <!-- <p id="currently-owedU2Total">Total Spent: $</p> -->
              <p id="currently-owedU2Owed">Money owed: $103</p>
            </div>
          </div>
        </div>
        <!-- Btn Row -->
        <div class="btn-row">
          <button id="clearcurrently-owedBtn">Paid</button>
        </div>
      </div>

      <!-- Add Expense -->
      <div id="add-expense" class="card">
        <div>
          <h4>Add Expense</h4>
        </div>

        <div class="add-expense_middle-container">
          <!-- User Select -->
          <div class="add-expense_inner-container">
            <label id="expense-user-select">User</label>
            <select id="expense-user-select">
              <option value="[user 1]">User 1</option>
              <option value="[user 2]">User 2</option>
            </select>
          </div>
          <!-- Expense Name -->
          <div class="add-expense_inner-container">
            <label for="expense-name-input">Expense Name</label>
            <input id="expenseNameInput" type="text" />
          </div>
          <!-- Expense Amount -->
          <div class="add-expense_inner-container">
            <label for="expense-amount-input">Total Amount ($)</label>
            <input id="expenseAmountInput" type="number" />
          </div>
          <!-- Your Cost Share (%) -->
          <div class="add-expense_inner-container">
            <label for="cost-share-input">Your Cost Share (%)</label>
            <input id="costShareInput" type="number" />
          </div>
        </div>
        <!-- Btn Row -->
        <div class="btn-row">
          <button id="addExpenseBtn">Add Expense</button>
        </div>
      </div>

      <!-- Edit Users -->
      <div id="add-expense" class="card">
        <div>
          <h4>Edit Users</h4>
        </div>

        <div class="edit-user_middle-container">
          <!-- User 1 -->
          <div class="edit-user_inner-container">
            <label for="edit-user-input">User 1 Name</label>
            <input id="editUser1Input" type="text" />
          </div>
          <!-- User 2 -->
          <div class="edit-user_inner-container">
            <label for="edit-user-input">User 2 Name</label>
            <input id="editUser2Input" type="text" />
          </div>
        </div>
        <!-- Btn Row -->
        <div class="btn-row">
          <button id="saveUsersBtn">Save</button>
        </div>
      </div>

      <!-- Currency Converter (API) -->
      <div id="converter" class="card">
        <div>
          <h4>Currency Converter</h4>
        </div>

        <div class="currency-converter_middle-container">
          <!-- From -->
          <div class="currency-converter_inner-container">
            <label for="convert-from-input">From</label>
            <div class="control-row">
              <input type="number" id="convert-from-input" />
              <select>
                <option>CAD</option>
                <option>USD</option>
                <option>EUR</option>
                <option>GBP</option>
                <option>AUD</option>
              </select>
            </div>
          </div>
          <!-- To -->
          <div class="currency-converter_inner-container">
            <label for="convert-to-output">To</label>
            <div class="control-row">
              <output id="convert-to-output"></output>
              <select>
                <option>CAD</option>
                <option>USD</option>
                <option>EUR</option>
                <option>GBP</option>
                <option>AUD</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Expense Log -->
      <div id="log" class="card">
        <div>
          <h4>History</h4>
        </div>

        <div>
          <div>
            <!-- <span>[DATE]</span> <span>[EXPENSE NAME]</span> <span>[TOTAL EXPENSE AMOUNT]</span> <span>[USER 1]</span> <span>[USER 2]</span> -->
          </div>
          <ul id="historyList"></ul>
        </div>
      </div>
    </main>
  </body>
</html>
