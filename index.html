<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />

    <title>Perfectly Square</title>
  </head>
  <body>
    <header>
      <h1>Perfectly Square</h1>
      <h2>Expense splitter for two</h2>
    </header>

    <main>
      <!-- Summary -->
      <div id="summary" class="card">
        <div>
          <h3>Summary</h3>
        </div>
        
        <div class="summary_middle-container">
            <!-- User 1 -->
          <div class="summary_user">
            <h5>[user 1]</h5>
            <div class="summary_inner-container">
              <!-- <p id="summaryU1Total">Total Spent: $</p> -->
              <p id="summaryU1Owed">Money owed: $</p>
            </div>
          </div>
          <!-- User 2 -->
          <div class="summary_user">
            <h5>[user 2]</h5>
            <div class="summary_inner-container">
              <!-- <p id="summaryU2Total">Total Spent: $</p> -->
              <p id="summaryU2Owed">Money owed: $</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Add Expense -->
      <div id="add-expense" class="card">
        <div>
          <h4>Add Expense</h4>
        </div>
        
        <div class="add-expense_middle-container">
            <!-- User Select -->
          <div class="add-expense_inner-container">
            <label id="expense-user-select">User</label>
            <select id="expense-user-select">
              <option value="[user 1]">User 1</option>
              <option value="[user 2]">User 2</option>
            </select>
          </div>
          <!-- Expense Name -->
          <div class="add-expense_inner-container">
            <label for="expense-name-input">Expense Name</label>
            <input id="expenseNameInput" type="text">
          </div>
          <!-- Expense Amount -->
          <div class="add-expense_inner-container">
            <label for="expense-amount-input">Amount ($)</label>
            <input id="expenseAmountInput" type="number">
          </div>
          <!-- Your Cost Share (%) -->
           <div class="add-expense_inner-container">
            <label for="cost-share-input">Your Cost Share (%)</label>
            <input id="costShareInput" type="number">
           </div>
        </div>
        <!-- Btn Row -->
         <div class="btn-row">
          <button id="addExpenseBtn">Add Expense</button>
         </div>
      </div>

      <!-- Currency Converter (API) -->
      <div id="converter" class="card">
        <div>
          <h4>Currency Converter</h4>
        </div>
        
        <div class="currency-converter_middle-container">
            <!-- From -->
            <div class="currency-converter_inner-container">
                <label for="convert-from-input">From</label>
                <input type="number" id="convert-from-input">
                <select>
                    <option>Canadian Dollar</option>
                    <option>United States Dollar</option>
                    <option>Euro</option>
                    <option>British Pound</option>
                    <option>Australian Dollar</option>
                </select>
            </div>
            <!-- To -->
             <div class="currency-converter_inner-container">
                <label for="convert-to-output">To</label>
                <output id="convert-to-output">[OUTPUT PLACEHOLDER]</output>
                <select>
                    <option>Canadian Dollar</option>
                    <option>United States Dollar</option>
                    <option>Euro</option>
                    <option>British Pound</option>
                    <option>Australian Dollar</option>
                </select>
             </div>
        </div>
      </div>

      <!-- Expense Log -->
      <div id="log" class="card">
        <div>
          <h4>History</h4>
        </div>
        
        <div>
          <ul id="historyList">
            [DATE] [EXPENSE NAME] [TOTAL EXPENSE AMOUNT] [USER 1] [USER 2] 
          </ul>
        </div>
      </div>
      
    </main>
  </body>
</html>
